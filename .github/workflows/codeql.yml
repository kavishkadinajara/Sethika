name: CodeQL

# Static security analysis for both halves of the stack.
#
# Note: on a private repository this requires GitHub Advanced Security. If the repo is
# private and without GHAS, this workflow will fail - delete it or make the repo public.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Catches newly published advisories against code that has not changed.
    - cron: "0 3 * * 1"

permissions:
  contents: read
  security-events: write
  # The analyze step reads its own workflow run; without this it fails with
  # "Resource not accessible by integration" after the analysis has finished.
  actions: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build
        if: matrix.language == 'csharp'
        run: dotnet build Sethika.sln -c Release -v minimal

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
