version: 2

updates:
  - package-ecosystem: nuget
    directory: "/"
    # PRs go to develop, the branch every change reaches main through (they went to main
    # until 2026-11-08 and could not be merged as they were).
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # One PR for the EF Core family: their versions move together and splitting them
      # produces PRs that cannot pass CI on their own.
      entity-framework:
        patterns: ["Microsoft.EntityFrameworkCore*"]
      aspnet:
        patterns: ["Microsoft.AspNetCore*", "Microsoft.Extensions*"]
      test:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk", "coverlet*"]

  - package-ecosystem: npm
    directory: "/web"
    # PRs go to develop, the branch every change reaches main through (they went to main
    # until 2026-11-08 and could not be merged as they were).
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      next:
        patterns: ["next", "react", "react-dom", "eslint-config-next"]
      tooling:
        patterns: ["eslint*", "@typescript-eslint/*", "typescript", "prettier"]
    ignore:
      # The types follow the Node the app runs on (22, as in CI), not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    # PRs go to develop, the branch every change reaches main through (they went to main
    # until 2026-11-08 and could not be merged as they were).
    target-branch: develop
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
